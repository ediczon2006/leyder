<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LEYTRIX ISP — Clientes</title>
  <link rel="stylesheet" href="css/app.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/ai-cobranza.js"></script>
</head>
<body>

  <!-- SIDEBAR -->
  <nav id="sidebar"></nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main id="main">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px">
      <div class="page-header" style="margin-bottom:0">
        <h2>👥 Clientes Registrados</h2>
        <p id="txtContadorClientes">Cargando clientes...</p>
      </div>
      <div class="btn-group">
        <a href="agregar.html" class="btn btn-primary">➕ Nuevo Cliente</a>
        <button class="btn btn-outline" onclick="sincronizarConSupabase()">☁️ Sincronizar Nube</button>
      </div>
    </div>

    <!-- Barra de Filtros y Búsqueda -->
    <div class="card" style="padding:16px 20px;margin-bottom:18px">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <div style="flex:1;min-width:240px">
          <input type="text" id="filtBus" placeholder="🔍 Buscar por nombre, IP, DNI, celular, dirección..."
            style="width:100%;padding:9px 14px;border:1.5px solid var(--borde);border-radius:8px;font-size:0.85rem;outline:none"/>
        </div>
        <select id="filtZona" style="padding:9px 12px;border:1.5px solid var(--borde);border-radius:8px;font-size:0.85rem;background:#fff;outline:none">
          <option value="">Todas las Zonas</option>
          <option value="Loboyacu">Loboyacu</option>
          <option value="Huayranga">Huayranga</option>
          <option value="Pacotillo">Pacotillo</option>
          <option value="Ramal de Cachiyacu">Ramal de Cachiyacu</option>
          <option value="Palmeras">Palmeras</option>
          <option value="Shishiyacu">Shishiyacu</option>
        </select>
        <select id="filtEstado" style="padding:9px 12px;border:1.5px solid var(--borde);border-radius:8px;font-size:0.85rem;background:#fff;outline:none">
          <option value="">Todos los Estados</option>
          <option value="ACTIVO">ACTIVO</option>
          <option value="CORTADO">CORTADO</option>
          <option value="PENDIENTE">PENDIENTE</option>
          <option value="RETIRADO">RETIRADO</option>
        </select>
        <select id="filtPlan" style="padding:9px 12px;border:1.5px solid var(--borde);border-radius:8px;font-size:0.85rem;background:#fff;outline:none">
          <option value="">Todos los Planes</option>
          <option value="50">S/. 50 — Básico</option>
          <option value="60">S/. 60 — Plus</option>
          <option value="65">S/. 65 — Normal</option>
        </select>
        <button class="btn btn-outline" onclick="resetFiltros()">Limpiar</button>
      </div>
    </div>

    <!-- Tabla de Clientes -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Zona</th>
            <th>Dirección IP</th>
            <th>Plan</th>
            <th>Cable</th>
            <th>Estado</th>
            <th>Inicio</th>
            <th>Celular</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="bodyClientes">
          <tr><td colspan="10" style="text-align:center;padding:40px;color:var(--gris)">Cargando lista de clientes...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Paginación -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap;gap:10px">
      <span style="font-size:0.82rem;color:var(--gris)" id="paginfoClientes">Página 1</span>
      <div class="btn-group" id="paginacionClientes">
        <button class="btn btn-outline btn-sm" id="btnPagPrev" onclick="cambiarPagina(-1)">◀ Anterior</button>
        <button class="btn btn-outline btn-sm" id="btnPagNext" onclick="cambiarPagina(1)">Siguiente ▶</button>
      </div>
    </div>
  </main>

  <!-- MODAL EDITAR CLIENTE -->
  <div class="modal-bg" id="modalEditar">
    <div class="modal">
      <div class="modal-header">
        <h3>✏️ Editar Cliente</h3>
        <button class="modal-close" onclick="cerrarModal('modalEditar')">✕</button>
      </div>
      <form id="formEditar">
        <input type="hidden" id="eId"/>
        <div class="form-grid">
          <div class="form-group">
            <label>Nombre y Apellidos *</label>
            <input id="eNombre" required maxlength="100"/>
          </div>
          <div class="form-group">
            <label>DNI (8 dígitos)</label>
            <input id="eDni" maxlength="8"/>
          </div>
          <div class="form-group">
            <label>Celular</label>
            <input id="eCelular" maxlength="15"/>
          </div>
          <div class="form-group">
            <label>Fecha de Inicio</label>
            <input type="date" id="eFechaInicio"/>
          </div>
          <div class="form-group">
            <label>Dirección IP *</label>
            <input id="eIp" required maxlength="15"/>
          </div>
          <div class="form-group">
            <label>Zona</label>
            <select id="eZona">
              <option value="Loboyacu">Loboyacu</option>
              <option value="Huayranga">Huayranga</option>
              <option value="Pacotillo">Pacotillo</option>
              <option value="Ramal de Cachiyacu">Ramal de Cachiyacu</option>
              <option value="Palmeras">Palmeras</option>
              <option value="Shishiyacu">Shishiyacu</option>
            </select>
          </div>
          <div class="form-group">
            <label>Plan Mensual</label>
            <select id="ePlan">
              <option value="50">S/. 50 — Plan Básico</option>
              <option value="60">S/. 60 — Plan Plus</option>
              <option value="65">S/. 65 — Plan Normal</option>
            </select>
          </div>
          <div class="form-group">
            <label>Cable Instalado</label>
            <select id="eCable">
              <option value="false">❌ Sin cable</option>
              <option value="true">✅ Con cable</option>
            </select>
          </div>
          <div class="form-group">
            <label>Estado del Servicio</label>
            <select id="eEstado">
              <option value="ACTIVO">ACTIVO</option>
              <option value="CORTADO">CORTADO</option>
              <option value="PENDIENTE">PENDIENTE</option>
              <option value="RETIRADO">RETIRADO</option>
            </select>
          </div>
          <div class="form-group">
            <label>Dirección Física</label>
            <input id="eDireccion" maxlength="200"/>
          </div>
          <div class="form-group form-full">
            <label>Observaciones</label>
            <textarea id="eObs" rows="2" maxlength="400"></textarea>
          </div>
        </div>
        <div class="btn-group" style="margin-top:20px;justify-content:flex-end">
          <button type="button" class="btn btn-outline" onclick="cerrarModal('modalEditar')">Cancelar</button>
          <button type="submit" class="btn btn-primary">💾 Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL HISTORIAL DE PAGOS -->
  <div class="modal-bg" id="modalPagos">
    <div class="modal" style="max-width:520px">
      <div class="modal-header">
        <h3 id="modalPagosTit">💰 Historial de Pagos</h3>
        <button class="modal-close" onclick="cerrarModal('modalPagos')">✕</button>
      </div>
      <div id="modalPagosBody"></div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    let _paginaActual = 0;
    const PAGE_SIZE = 50;
    let _totalClientes = 0;
    let _busTimer = null;

    document.addEventListener('DOMContentLoaded', () => {
      renderSidebar('clientes');
      cargarClientes(0);

      window.onDatosActualizados = () => {
        cargarClientes(_paginaActual);
      };

      // Eventos de filtros
      ['filtZona', 'filtEstado', 'filtPlan'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => cargarClientes(0));
      });

      document.getElementById('filtBus').addEventListener('input', () => {
        clearTimeout(_busTimer);
        _busTimer = setTimeout(() => cargarClientes(0), 250);
      });

      document.getElementById('formEditar').addEventListener('submit', guardarEdicion);
    });

    async function cargarClientes(pagina = 0) {
      _paginaActual = pagina;
      const zona   = document.getElementById('filtZona').value;
      const estado = document.getElementById('filtEstado').value;
      const plan   = document.getElementById('filtPlan').value;
      const bus    = safe(document.getElementById('filtBus').value).toLowerCase();

      const tbody = document.getElementById('bodyClientes');
      tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:30px;color:var(--gris)"><span class="spinner"></span> Cargando...</td></tr>';

      try {
        let indexName = null;
        let range = null;

        if (zona && estado) {
          indexName = 'zona_estado';
          range = IDBKeyRange.only([zona, estado]);
        } else if (zona) {
          indexName = 'zona';
          range = IDBKeyRange.only(zona);
        } else if (estado) {
          indexName = 'estado';
          range = IDBKeyRange.only(estado);
        } else if (plan) {
          indexName = 'plan';
          range = IDBKeyRange.only(Number(plan));
        }

        const filter = c => {
          if (zona && c.zona !== zona) return false;
          if (estado && c.estado !== estado) return false;
          if (plan && Number(c.plan) !== Number(plan)) return false;
          if (bus) {
            const txt = `${c.id} ${c.nombre || ''} ${c.ip || ''} ${c.dni || ''} ${c.celular || ''} ${c.direccion || ''}`.toLowerCase();
            if (!txt.includes(bus)) return false;
          }
          return true;
        };

        const { results, total } = await IDB.query('clientes', {
          indexName,
          range,
          filter,
          limit: PAGE_SIZE,
          offset: pagina * PAGE_SIZE
        });

        _totalClientes = total;
        document.getElementById('txtContadorClientes').textContent =
          `👥 ${total.toLocaleString()} cliente(s) encontrado(s)`;

        if (!results.length) {
          tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="e-icon">👥</div>No hay clientes con los filtros seleccionados</div></td></tr>';
        } else {
          tbody.innerHTML = results.map(c => `
            <tr class="${c.estado === 'CORTADO' ? 'row-cortado' : ''}">
              <td>${Number(c.id)}</td>
              <td><strong>${esc(c.nombre)}</strong></td>
              <td>${esc(c.zona)}</td>
              <td><code>${esc(c.ip) || '—'}</code></td>
              <td><strong>S/. ${Number(c.plan || 0).toFixed(2)}</strong></td>
              <td>${badgeCable(c.cable)}</td>
              <td>${badgeEstado(c.estado)}</td>
              <td><span style="font-size:0.78rem;color:var(--gris)">${c.fecha_inicio ? esc(c.fecha_inicio) : '—'}</span></td>
              <td>${esc(c.celular) || '—'}</td>
              <td>
                <div class="btn-group">
                  <a href="pagos.html?id=${c.id}" class="btn btn-success btn-sm" title="Registrar pago">💳 Pagar</a>
                  <button class="btn btn-primary btn-sm" onclick="enviarMensajeIACliente(${c.id})" style="background:#7C3AED;border-color:#7C3AED" title="Enviar recordatorio con IA a WhatsApp">🤖</button>
                  <button class="btn btn-outline btn-sm" onclick="abrirEditar(${c.id})" title="Editar">✏️</button>
                  <button class="btn btn-ghost btn-sm" onclick="verHistorialPagos(${c.id})" title="Ver pagos">💰</button>
                  <button class="btn btn-danger btn-sm" onclick="eliminarCliente(${c.id})" title="Eliminar">🗑️</button>
                </div>
              </td>
            </tr>
          `).join('');
        }

        // Paginación
        const pagTotal = Math.ceil(total / PAGE_SIZE) || 1;
        document.getElementById('paginfoClientes').textContent = `Página ${_paginaActual + 1} de ${pagTotal} (${total} total)`;
        document.getElementById('btnPagPrev').disabled = (_paginaActual === 0);
        document.getElementById('btnPagNext').disabled = ((_paginaActual + 1) >= pagTotal);
      } catch(err) {
        console.error('cargarClientes error:', err);
        tbody.innerHTML = '<tr><td colspan="10" style="padding:20px;color:var(--rojo);text-align:center">Error cargando clientes</td></tr>';
      }
    }

    function cambiarPagina(delta) {
      const nueva = _paginaActual + delta;
      if (nueva >= 0) cargarClientes(nueva);
    }

    function resetFiltros() {
      document.getElementById('filtBus').value = '';
      document.getElementById('filtZona').value = '';
      document.getElementById('filtEstado').value = '';
      document.getElementById('filtPlan').value = '';
      cargarClientes(0);
    }

    async function abrirEditar(id) {
      const c = await IDB.get('clientes', Number(id));
      if (!c) { toast('Cliente no encontrado', 'error'); return; }

      document.getElementById('eId').value          = c.id;
      document.getElementById('eNombre').value      = c.nombre || '';
      document.getElementById('eDni').value         = c.dni || '';
      document.getElementById('eCelular').value     = c.celular || '';
      document.getElementById('eFechaInicio').value = c.fecha_inicio || '';
      document.getElementById('eIp').value          = c.ip || '';
      document.getElementById('eDireccion').value   = c.direccion || '';
      document.getElementById('eZona').value        = c.zona || 'Loboyacu';
      document.getElementById('ePlan').value        = String(c.plan || 65);
      document.getElementById('eCable').value       = String(!!c.cable);
      document.getElementById('eEstado').value      = c.estado || 'ACTIVO';
      document.getElementById('eObs').value         = c.obs || '';

      document.getElementById('modalEditar').classList.add('open');
    }

    async function guardarEdicion(e) {
      e.preventDefault();
      const id = Number(document.getElementById('eId').value);
      const c = await IDB.get('clientes', id);
      if (!c) return;

      c.nombre       = safe(document.getElementById('eNombre').value, 100);
      c.dni          = safe(document.getElementById('eDni').value, 8);
      c.celular      = safe(document.getElementById('eCelular').value, 15);
      c.fecha_inicio = document.getElementById('eFechaInicio').value || null;
      c.ip           = safe(document.getElementById('eIp').value, 15);
      c.direccion    = safe(document.getElementById('eDireccion').value, 200);
      c.zona         = document.getElementById('eZona').value;
      c.plan         = Number(document.getElementById('ePlan').value);
      c.cable        = document.getElementById('eCable').value === 'true';
      c.estado       = document.getElementById('eEstado').value;
      c.obs          = safe(document.getElementById('eObs').value, 400);

      await IDB.put('clientes', c);
      cerrarModal('modalEditar');
      toast('✅ Cliente actualizado correctamente');
      cargarClientes(_paginaActual);
      actualizarEstadisticasSidebar();
    }

    async function verHistorialPagos(id) {
      const c = await IDB.get('clientes', Number(id));
      if (!c) return;

      document.getElementById('modalPagosTit').textContent = `💰 Pagos de ${c.nombre}`;
      const pagos = await IDB.getByIndex('pagos', 'id_cliente', Number(id));

      const body = document.getElementById('modalPagosBody');
      if (!pagos.length) {
        body.innerHTML = '<p style="padding:20px;text-align:center;color:var(--gris)">Sin pagos registrados para este cliente.</p>';
      } else {
        body.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Fecha</th><th>Mes</th><th>Monto</th><th>Método</th></tr></thead>
              <tbody>
                ${pagos.map(p => `
                  <tr>
                    <td>${p.fecha ? p.fecha.slice(0, 10) : '—'}</td>
                    <td><strong>${esc(p.mes)}</strong></td>
                    <td style="color:var(--verde);font-weight:700">S/. ${Number(p.monto).toFixed(2)}</td>
                    <td><span class="badge" style="background:#F1F5F9">${esc(p.metodo || 'EFECTIVO')}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }
      document.getElementById('modalPagos').classList.add('open');
    }

    async function eliminarCliente(id) {
      const c = await IDB.get('clientes', Number(id));
      if (!c) return;

      if (confirm(`¿Está seguro de eliminar permanentemente al cliente "${c.nombre}" y todo su historial de pagos y cortes?`)) {
        await IDB.eliminarClienteCompleto(Number(id));
        toast('🗑️ Cliente eliminado');
        cargarClientes(_paginaActual);
        actualizarEstadisticasSidebar();
      }
    }

    async function enviarMensajeIACliente(id) {
      const c = await IDB.get('clientes', Number(id));
      if (!c) return;
      const mes = mesActual();
      toast('🤖 Generando mensaje con IA...');
      const txt = await generarMensajeCobranzaIA({ cliente: c, mes, monto: c.plan || 65, tono: 'amable' });
      abrirWhatsAppConMensaje(c.celular, txt);
    }
  </script>
</body>
</html>
